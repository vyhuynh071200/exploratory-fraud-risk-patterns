<svg xmlns="http://www.w3.org/2000/svg" width="920" height="490" viewBox="0 0 920 490" role="img" aria-labelledby="chartTitle chartDescription">
<title id="chartTitle">Observed fraud share by failed authentication attempts in balanced synthetic sample</title>
<desc id="chartDescription">Rates within three groups from 2000 synthetic balanced transaction records, not population prevalence: 0 attempts 44.4% (646/1456); 1 attempt 44.4% (84/189); 2+ attempts 76.1% (270/355).</desc>
<style>
  .heading {font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #19314F}
  .subtitle {font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #52667E}
  .axis {font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #19314F}
  .meta {font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #66768A}
  .value {font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #19314F}
  .footnote {font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5B6E82}
</style>
<rect width="920" height="490" rx="18" fill="#FFFFFF"/>
<rect x="22" y="20" width="876" height="447" rx="16" fill="#F8FAFD" stroke="#DFE7F0"/>
<text x="42" y="65" class="heading">Observed fraud share by failed attempts</text>
<text x="42" y="92" class="subtitle">Synthetic bank transactions · Within-group descriptive percentages</text>
<rect x="42" y="111" width="835" height="32" rx="8" fill="#E5F4F3"/>
<text x="57" y="132" style="font:600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;fill:#076A73">BALANCED DEMO SAMPLE: 1,000 fraud + 1,000 non-fraud (2,000 total)</text>
<g>
  <text x="40" y="174" class="axis">0 attempts</text>
  <rect x="255" y="148" width="545" height="35" rx="8" fill="#E8EDF4"/>
  <rect x="255" y="148" width="241.81" height="35" rx="8" fill="#486C9D"/>
  <text x="508.80631868131866" y="172" class="value">44.4%</text>
  <text x="42" y="195" class="meta">n = 1,456 transactions</text>
 </g>
<g>
  <text x="40" y="249" class="axis">1 attempt</text>
  <rect x="255" y="223" width="545" height="35" rx="8" fill="#E8EDF4"/>
  <rect x="255" y="223" width="242.22" height="35" rx="8" fill="#486C9D"/>
  <text x="509.2222222222222" y="247" class="value">44.4%</text>
  <text x="42" y="270" class="meta">n = 189 transactions</text>
 </g>
<g>
  <text x="40" y="324" class="axis">2+ attempts</text>
  <rect x="255" y="298" width="545" height="35" rx="8" fill="#E8EDF4"/>
  <rect x="255" y="298" width="414.51" height="35" rx="8" fill="#087F8C"/>
  <text x="681.5070422535211" y="322" class="value">76.1%</text>
  <text x="42" y="345" class="meta">n = 355 transactions</text>
 </g>
<line x1="42" y1="395" x2="878" y2="395" stroke="#D7E1EB"/>
<text x="42" y="422" class="footnote">Rates describe this deliberately balanced sample; they do not estimate real-world fraud prevalence.</text>
<text x="42" y="443" class="footnote">Source: submit/data/sample_transactions.csv · Calculated from is_fraud and failed_attempts.</text>
</svg>